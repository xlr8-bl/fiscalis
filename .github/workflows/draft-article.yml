# Drafts the next queued journal topic with Gemini and posts it into the
# studio, where it waits with status `review` until a person publishes it.
#
# The agent token cannot publish, delete, or edit anything already live — the
# API refuses those, so the gate holds even if this workflow misbehaves.
#
# Repository Settings -> Secrets and variables -> Actions:
#   GEMINI_API_KEY   from https://aistudio.google.com/apikey
#   AGENT_TOKEN      the same value as the AGENT_TOKEN Pages secret
#   STUDIO_URL       https://web3ashley.com

name: Draft journal article

on:
  schedule:
    - cron: "0 8 * * 1"          # 08:00 UTC every Monday
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to draft (blank takes the next queued one)"
        required: false
        type: string

permissions:
  contents: write                # only to tick the topic off the queue

concurrency:
  group: draft-article
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draft and post to the studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
        run: |
          for name in GEMINI_API_KEY AGENT_TOKEN STUDIO_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See the header of this workflow file."
              exit 1
            fi
          done
          python3 tools/draft_article.py ${{ inputs.topic && format('"{0}"', inputs.topic) || '' }}

      - name: Tick the topic off the queue
        run: |
          if git diff --quiet -- content/topics.md; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Mark a journal topic as drafting" -- content/topics.md
          git push
