<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Speed carousel — Web3Ashley</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#141311; color:#e8e8e3; font:13px/1.5 system-ui,sans-serif; padding:26px 20px 70px; }
  h1 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 16px; opacity:.5; }
  .strip { display:flex; gap:12px; flex-wrap:wrap; }
  figure { margin:0; flex:1 1 300px; }
  canvas { width:100%; display:block; background:#000; }
  figcaption { opacity:.45; font-size:11px; padding-top:6px; }
</style></head><body>
<h1>Why your website is slow on a phone</h1>
<div class="strip" id="strip"></div>
<script type="module">
import { drawPanel, PANELS } from './assets/js/speed.js';
for (let i = 0; i < PANELS.length; i++) {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = `${i + 1} — ${PANELS[i][0]}`;
  f.append(c, cap); document.getElementById('strip').append(f);
  await drawPanel(c, i);
}
</script></body></html>
