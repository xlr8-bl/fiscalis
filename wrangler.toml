# Cloudflare Pages — static site + Pages Functions in /functions
name = "web3ashley"
compatibility_date = "2026-08-14"
pages_build_output_dir = "."

# --- Journal content ---------------------------------------------------
# The articles table. Create and migrate with:
#   npx wrangler d1 create web3ashley
#   npx wrangler d1 execute web3ashley --remote --file=./schema.sql
# then paste the id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "web3ashley"
database_id = "<run: npx wrangler d1 create web3ashley>"

# Images uploaded through the studio. Create with:
#   npx wrangler r2 bucket create web3ashley-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "web3ashley-media"

# --- Secrets (set these, never commit them) ----------------------------
#   npx wrangler pages secret put STUDIO_PASSWORD   # signs you into /studio
#   npx wrangler pages secret put AGENT_TOKEN       # Gemini Spark's token
#   npx wrangler pages secret put SESSION_SECRET    # signs the studio cookie
#   npx wrangler pages secret put RESEND_API_KEY    # booking emails

# Optional: store booking requests when no email provider is configured.
#   npx wrangler kv namespace create BOOKINGS
# [[kv_namespaces]]
# binding = "BOOKINGS"
# id = "<your-namespace-id>"
