# Cloudflare Pages — static site + Pages Functions in /functions
name = "web3ashley"
compatibility_date = "2026-08-14"
pages_build_output_dir = "."

# Pages supports a narrow set of keys here; anything else fails the build
# rather than being ignored. Inheritable: name, pages_build_output_dir,
# compatibility_date, compatibility_flags, send_metrics, limits, placement,
# upload_source_maps. Bindings: vars, d1_databases, r2_buckets,
# kv_namespaces, queues.producers, durable_objects, hyperdrive, services,
# vectorize, analytics_engine_datasets, ai.
#
# Secrets are not declared here at all — they live in the dashboard under
# Variables and Secrets, in a separate store, so a deploy cannot disturb
# them. (No `vars` are declared either, so there is nothing to overwrite.)

# --- Journal content ---------------------------------------------------
# The content database. The tables and the seed are applied from the studio
# on first sign-in (Set up), so there is nothing to run here.
[[d1_databases]]
binding = "DB"
database_name = "web3ashley"
database_id = "e7e23024-ebc9-4378-8b70-302e0cdc0ce0"

# Images uploaded through the studio. Create with:
#   npx wrangler r2 bucket create web3ashley-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "web3ashley-media"

# --- Drawing the slides ------------------------------------------------
# Workers AI draws the picture behind each slide. It is bound in the
# DASHBOARD, not here: Pages project -> Settings -> Functions -> Bindings
# -> Add -> Workers AI, named AI.
#
# It is not in this file, and that is not an oversight. Workers AI has no
# local implementation, so `wrangler pages dev` classifies the binding as
# remote-only and opens a proxy session to Cloudflare to serve it, which
# needs a CLOUDFLARE_API_TOKEN. Declared here, every local run and every
# check suite dies at startup with no way out: `pages dev` rejects
# --config, so a stripped copy cannot be pointed at either, and
# `experimental_remote = false` is ignored for this binding.
#
# The cost of the dashboard is that the binding is not in version
# control, so a rebuilt project comes back unable to draw. What catches
# that is the studio: Social -> Accounts says "Not bound on this
# deployment yet" rather than failing at the first carousel.
#
# This is the free path. The Workers Free plan includes 10,000 Neurons a
# day and Flux Schnell is about 58 neurons a picture, so twenty-five
# slides a day is roughly 14% of it. Past the allowance the Free plan
# errors rather than charging, so there is no bill to be surprised by.
#
# The paid path (Google, Nano Banana) needs no binding at all, just an
# API key. Which one runs is a setting in the studio.

# --- Secrets (never commit these) --------------------------------------
# Dashboard: your Pages project -> Settings -> Variables and Secrets -> Add,
# with Encrypt ticked. Or `npx wrangler pages secret put <NAME>`.
#
#   STUDIO_PASSWORD   signs you into /studio.html
#   SESSION_SECRET    signs the studio cookie — any long random string
#   AGENT_TOKEN       Gemini Spark's token, once you wire it up
#   STUDIO_USERS      optional: {"ashley":"…","sam":"…"} for more than one person
#   RESEND_API_KEY    optional: sends the booking emails

# Optional: store booking requests when no email provider is configured.
#   npx wrangler kv namespace create BOOKINGS
# [[kv_namespaces]]
# binding = "BOOKINGS"
# id = "<your-namespace-id>"
