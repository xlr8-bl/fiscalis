# Cloudflare Pages — static site + Pages Functions in /functions
name = "web3ashley"
compatibility_date = "2026-08-14"
pages_build_output_dir = "."

# This file is the source of truth for a Pages project, and by default a
# deploy overwrites variables set in the dashboard. Secrets are added in the
# dashboard here, so keep them.
keep_vars = true

# --- Journal content ---------------------------------------------------
# The content database. The tables and the seed are applied from the studio
# on first sign-in (Set up), so there is nothing to run here.
[[d1_databases]]
binding = "DB"
database_name = "web3ashley"
database_id = "e7e23024-ebc9-4378-8b70-302e0cdc0ce0"

# Images uploaded through the studio. Create with:
#   npx wrangler r2 bucket create web3ashley-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "web3ashley-media"

# --- Secrets (never commit these) --------------------------------------
# Dashboard: your Pages project -> Settings -> Variables and Secrets -> Add,
# with Encrypt ticked. Or `npx wrangler pages secret put <NAME>`.
#
#   STUDIO_PASSWORD   signs you into /studio.html
#   SESSION_SECRET    signs the studio cookie — any long random string
#   AGENT_TOKEN       Gemini Spark's token, once you wire it up
#   STUDIO_USERS      optional: {"ashley":"…","sam":"…"} for more than one person
#   RESEND_API_KEY    optional: sends the booking emails

# Optional: store booking requests when no email provider is configured.
#   npx wrangler kv namespace create BOOKINGS
# [[kv_namespaces]]
# binding = "BOOKINGS"
# id = "<your-namespace-id>"
