<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>slides</title>
<style>body{margin:0;background:#101010;display:grid;place-items:center;min-height:100vh}
canvas{width:432px;height:540px}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
/* Drives the content-carousel templates in assets/js/slides.js. The
   browser is required for the same reason the hook preview needs it:
   the flow is measured with real font metrics. */
import { drawSlide, W, H, TEMPLATE_NAMES, slideCatalogue } from '/assets/js/slides.js';
import { ICON_NAMES, iconUrl } from '/assets/js/icons.js';
import { APP_NAMES, appUrl } from '/assets/js/apps.js';

const ctx = document.getElementById('c').getContext('2d');

/*
 * The families the design names, and what stands in until the real
 * files are bought. Pangram Pangram's PP Neue Montreal and PP NeueBit
 * are free to try for personal use and licensed for commercial use, so
 * they are not in the repository. Drop `neue-montreal-*.woff2` and
 * `neuebit.woff2` into assets/fonts and the first entry wins.
 *
 * TeX Gyre Heros stands in for Neue Montreal: both are neo-grotesques
 * on Helvetica's proportions, so the measured tracking and the line
 * budget hold. Press Start 2P stands in for NeueBit and is a coarser
 * bitmap, so the rail and the label will look chunkier than intended
 * until the real one arrives.
 */
window.FACES_IN_USE = await (await import('/assets/js/faces.js')).loadFaces();

const load = (src) => new Promise((res) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src;
});
const icons = {};
await Promise.all(ICON_NAMES.map(async (n) => { icons[n] = await load(iconUrl(n)); }));

// Ashley's own photographs, for the cut-out portrait block
const PORTRAITS = ['blue-flat', 'black-wall', 'sky-arms', 'phone-chair'];
const portraits = {};
await Promise.all(PORTRAITS.map(async (n) => {
  portraits[n] = await load(`/assets/stock/own/${n}.jpg`);
}));

// props keyed out of a reference, drawn as objects rather than as photos
const objects = { handset: await load('/assets/stock/objects/handset.png') };

// brand marks, for the tools template
const apps = {};
await Promise.all(APP_NAMES.map(async (n) => { apps[n] = await load(appUrl(n)); }));

/* Captures. In the studio these come out of R2 by key; here anything
   the slide names is looked for under a local folder, so a template can
   be drawn without a Cloudflare token. */
const shots = {};
window.SHOT = async (key, url) => { shots[key] = await load(url); };

window.CATALOGUE = slideCatalogue();
window.TEMPLATES = TEMPLATE_NAMES;
window.render = async (slide) => {
  const art = { icons, portraits, objects, apps, shots };
  /* A slide names a scene by file stem, the same way it names a
     portrait. Treating it as a URL meant `scene: 'black-wall'` fetched
     nothing and the slide drew as a bare ground. */
  if (slide.scene) {
    art.scene = portraits[slide.scene]
      ?? await load(slide.scene.includes('/') ? slide.scene
                    : `/assets/stock/own/${slide.scene}.jpg`);
  }
  ctx.clearRect(0, 0, W, H);
  const r = drawSlide(ctx, slide, { art });
  return { over: r.over, png: document.getElementById('c').toDataURL('image/png') };
};
window.READY = true;
</script></body></html>
