<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>decks</title>
<style>body{margin:0;background:#101010;display:grid;place-items:center;min-height:100vh}
canvas{width:432px;height:540px}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
/*
 * Drives lib/hooks/decks.js. Same engine as compose.html; the only
 * difference is that a slide names its layout instead of being one, and
 * the layout may come from either file — measured hooks from
 * layouts.js, invented inside slides from inside.js.
 */
import { compose, W, H } from '/assets/js/compose.js';
import { LAYOUTS } from '/lib/hooks/layouts.js';
import { INSIDE } from '/lib/hooks/inside.js';
import { DECKS, DECK_IDS } from '/lib/hooks/decks.js';
import { resolveArt } from '/lib/hooks/art.js';
import { CUTOUTS } from '/lib/hooks/cutouts.js';
import { STOCK } from '/lib/hooks/stock.js';

const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });

const FILES = {
  Bricolage: ['bricolage-var.woff2', { weight: '200 800' }],
  Outfit: ['outfit-var.woff2', { weight: '100 900' }],
  Archivo: ['archivo-var.woff2', { weight: '100 900' }],
  Anton: ['anton.woff2', { weight: '400' }],
  ArchivoBlack: ['archivo-black.woff2', { weight: '900' }],
  BagelFat: ['bagel-fat.woff2', { weight: '400' }],
  Bodoni: ['bodoni-700.woff2', { weight: '700' }],
  BodoniItalic: ['bodoni-italic.woff2', { weight: '500' }],
  Script: ['yellowtail.woff2', { weight: '400' }],
  Gochi: ['gochi-hand.woff2', { weight: '400' }],
  Inter: ['inter-500.woff2', { weight: '500' }],
  InstrumentItalic: ['instrument-italic.woff2', { weight: '400' }],
  PixelDisplay: ['pixel.woff2', { weight: '400' }],
};
await Promise.all(Object.entries(FILES).map(async ([n, [f, d]]) => {
  const ff = new FontFace(n, `url(/assets/fonts/${f})`, d); await ff.load(); document.fonts.add(ff);
}));
await document.fonts.ready;

const get = (src) => new Promise((res) => {
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
});

window.DECK_IDS = DECK_IDS;
window.LENGTHS = Object.fromEntries(DECK_IDS.map((k) => [k, DECKS[k].slides.length]));

const seedOf = (s) => [...s].reduce((h, c) => (h * 33 + c.charCodeAt(0)) >>> 0, 5381);

window.slide = async (deckId, n) => {
  const deck = DECKS[deckId];
  const s = deck.slides[n];
  const base = LAYOUTS[s.layout] ?? INSIDE[s.layout];
  if (!base) throw new Error(`no layout ${s.layout}`);
  /* A slide may move a device onto another ground without a second
     layout — that is the only thing a deck is allowed to override. */
  const spec = s.ground ? { ...base, ground: s.ground } : base;
  const art = {};
  /* Seeded per slide, so two `plate` slides in one deck do not resolve
     to the same photograph. */
  const seed = seedOf(deckId) + n * 7919;
  for (const slot of spec.slots.filter((x) => x.t === 'art')) {
    const got = resolveArt(slot, { own: window.OWN ?? {}, stock: STOCK, cut: CUTOUTS, seed });
    if (got.urls?.length > 1) art[slot.id] = await Promise.all(got.urls.map(get));
    else if (got.url) art[slot.id] = await get(got.url);
  }
  ctx.clearRect(0, 0, W, H);
  const report = compose(ctx, { ...spec, seed }, s.copy, art);
  return { url: ctx.canvas.toDataURL('image/jpeg', 0.92), ...report, layout: s.layout };
};
</script></body></html>
