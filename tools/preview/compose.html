<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>compose</title>
<style>body{margin:0;background:#101010;display:grid;place-items:center;min-height:100vh}
canvas{width:432px;height:540px}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
/*
 * Drives lib/hooks/layouts.js through assets/js/compose.js.
 * The browser is required: the layout engine measures with the real
 * font metrics and the halftone works on decoded pixels.
 */
import { compose, W, H, FACES } from '/assets/js/compose.js';
import { LAYOUTS, MEASURED, brief } from '/lib/hooks/layouts.js';
import { EXAMPLES, sample } from '/lib/hooks/examples.js';
import { resolveArt } from '/lib/hooks/art.js';
import { screened, standee } from '/assets/js/slides.js';
import { CUTOUTS } from '/lib/hooks/cutouts.js';
import { STOCK } from '/lib/hooks/stock.js';

const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });

/*
 * Each face registers the weights it actually carries.
 *
 * A FontFace with no weight descriptor is registered at 400, so every
 * `weight: '700'` in a layout was being FAUX-BOLDED on top of a file that
 * was already bold — Bricolage's own weight class is 800 — and the whole
 * corpus rendered a stop heavier and blunter than the references. The
 * three faces layouts ask for more than one weight of are the variable
 * cuts; the single-weight files declare the one weight they hold, so a
 * layout asking for it gets the outline instead of a synthesis.
 */
const FILES = {
  Bricolage: ['bricolage-var.woff2', { weight: '200 800' }],
  Outfit: ['outfit-var.woff2', { weight: '100 900' }],
  Archivo: ['archivo-var.woff2', { weight: '100 900' }],
  Anton: ['anton.woff2', { weight: '400' }],
  ArchivoBlack: ['archivo-black.woff2', { weight: '900' }],
  BagelFat: ['bagel-fat.woff2', { weight: '400' }],
  Bodoni: ['bodoni-700.woff2', { weight: '700' }],
  BodoniItalic: ['bodoni-italic.woff2', { weight: '500' }],
  Script: ['yellowtail.woff2', { weight: '400' }],
  Gochi: ['gochi-hand.woff2', { weight: '400' }],
  Inter: ['inter-500.woff2', { weight: '500' }],
  /* Three files, one family. Helvetica has no variable cut and no
     weights between roman and bold, which is the face, not a shortfall:
     ask for 500 and you get the roman, ask for 700 and you get the bold
     outline rather than a synthesised one. */
  Helvetica: [['heros-regular.woff2', { weight: '100 500' }],
              ['heros-bold.woff2', { weight: '600 900' }],
              ['heros-italic.woff2', { weight: '100 500', style: 'italic' }]],
  InstrumentItalic: ['instrument-italic.woff2', { weight: '400' }],
  PixelDisplay: ['pixel.woff2', { weight: '400' }],
  NeueBit: ['neuebit.woff2', { weight: '400 900' }],
  Mondwest: ['mondwest-regular.woff2', { weight: '400' }],
};
await Promise.all(Object.entries(FILES).flatMap(([n, v]) =>
  (Array.isArray(v[0]) ? v : [v]).map(async ([f, d]) => {
    const ff = new FontFace(n, `url(/assets/fonts/${f})`, d);
    await ff.load(); document.fonts.add(ff);
  })));
await document.fonts.ready;

const get = (src) => new Promise((res) => {
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
});

window.IDS = MEASURED;
window.BRIEF = brief;

window.EXAMPLES = EXAMPLES;

/* n picks which of the layout's examples to draw, so the range can be
   seen rather than asserted. */
const seedOf = (s) => [...s].reduce((h, c) => (h * 33 + c.charCodeAt(0)) >>> 0, 5381);
window.render = async (id, n = 0) => {
  const spec = LAYOUTS[id];
  if (!spec) throw new Error(`no layout ${id}`);
  const copy = (EXAMPLES[id]?.[n]) ?? sample(id);
  /* Pictures come from the resolver, never from the spec, and `own` is
     left to it. Passing an empty object here was overriding the
     resolver's own mapping with nothing, so every layout rendered
     against stock while his four photographs sat in the repository. */
  const art = {};
  const used = {};
  for (const slot of spec.slots.filter((x) => x.t === 'art')) {
    const got = resolveArt(slot, { ...(window.OWN ? { own: window.OWN } : {}),
                                   stock: STOCK, cut: CUTOUTS, seed: seedOf(id) + n });
    used[slot.id] = got.from;
    if (got.from === 'own') {
      /* Everything the sheets already do to him, done here too, with the
         SLIDE renderer's own functions so there is one definition of the
         look rather than two that drift.

         A keyed one is handed over as a one-item ARRAY on purpose: that
         is drawArt's row path, which bottom-aligns to the box's foot, so
         a photograph cut at the bottom STANDS on the layout's horizontal
         instead of floating in the middle of its slot. */
      const im = await get(got.url);
      if (im && got.cut) {
        const s = standee(im, { style: got.cut });
        art[slot.id] = (got.stands && s) ? [s] : (s ?? im);
      } else if (im) {
        art[slot.id] = screened(im, im.naturalWidth, im.naturalHeight);
      }
    } else if (got.urls?.length > 1) art[slot.id] = await Promise.all(got.urls.map(get));
    else if (got.url) art[slot.id] = await get(got.url);
  }
  ctx.clearRect(0, 0, W, H);
  const report = compose(ctx, spec, copy, art);
  return { url: ctx.canvas.toDataURL('image/jpeg', 0.92), ...report, art: used };
};
void FACES;
</script></body></html>
