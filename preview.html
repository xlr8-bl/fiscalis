<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panels — Web3Ashley</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#141311; color:#e8e8e3;
         font:13px/1.5 system-ui,sans-serif; padding:26px 20px 70px; }
  h1 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 14px; opacity:.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  figure { margin:0; }
  canvas { width:100%; display:block; background:#000; }
  figcaption { opacity:.45; font-size:11px; padding-top:5px; }
</style>
</head>
<body>
<h1>Eight designs</h1>
<div class="grid" id="grid"></div>
<script type="module">
import { draw, DESIGNS } from './assets/js/decks.js';
for (let i = 0; i < DESIGNS.length; i++) {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = `${i + 1} — ${DESIGNS[i][0]}`;
  f.append(c, cap);
  document.getElementById('grid').append(f);
  await draw(c, i);
}
</script>
</body>
</html>
