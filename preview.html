<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carousel — Web3Ashley</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#141311; color:#e8e8e3;
         font:14px/1.5 ui-monospace,monospace; padding:28px 20px 80px; }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 24px; opacity:.6; }
  .strip { display:flex; gap:14px; overflow-x:auto; padding-bottom:16px; }
  figure { margin:0; flex:0 0 auto; }
  canvas { width:320px; height:400px; display:block; background:#000; }
  figcaption { opacity:.45; font-size:11px; padding-top:6px; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
<h1>One carousel · five slides, five compositions</h1>
<div class="strip" id="strip"></div>
<script type="module">
import { draw, SLIDES } from './assets/js/carousel.js';
const names = ['scale + air (5418)','fragments (5424)','knockout (5405)','stagger (5409)','editorial (5404)'];
for (let i = 0; i < SLIDES.length; i++) {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  const cap = document.createElement('figcaption');
  cap.textContent = `${i+1} · ${names[i]}`;
  f.append(c, cap);
  document.getElementById('strip').append(f);
  await draw(c, i);
}
</script>
</body>
</html>
